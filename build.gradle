plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version
base {
    archivesName = "tfcr-fixes"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    // Compile-only references for mixins that target these mods' classes.
    compileOnly files("libs/ColdSweat-2.4.2.jar")
    compileOnly files("libs/tfc_coldsweat-2.1.2.jar")
    compileOnly files("libs/fancymenu_neoforge_3.8.1_MC_1.21.1.jar")
    compileOnly files("libs/TerraFirmaCraft-NeoForge-1.21.1-4.2.9.jar")
    compileOnly files("libs/Firmalife-NeoForge-1.21.1-3.0.14.jar")
    compileOnly files("libs/emi-1.1.24+1.21.1+neoforge.jar")
    compileOnly files("libs/sable-neoforge-1.21.1-2.0.5.jar")
    compileOnly files("libs/sable-companion-common-1.21.1-1.6.0.jar")
    // NOTE: TFC / cosmonautics are targeted by string-based @Mixin(targets=...) only.
    // Their jars must NOT be put on the compile classpath: cosmonautics' shaded orekit
    // registers a javac plugin (META-INF/services) whose class is not present, which
    // crashes javac with a ServiceConfigurationError.
}

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
